<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="topbar">
  <span class="topbar-title">Expense Tracker</span>
</nav>

<div class="container py-4">

  <!-- Alert -->
  <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

  <!-- Summary cards -->
  <div class="summary-grid mb-4">
    <div class="summary-card">
      <div class="summary-label">Total</div>
      <div class="summary-value" id="summaryTotal">0.00</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Number of expenses</div>
      <div class="summary-value" id="summaryCount">0</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Highest expense</div>
      <div class="summary-value" id="summaryHighestAmount">0.00</div>
      <div class="summary-sub" id="summaryHighestTitle">-</div>
    </div>
  </div>

  <!-- Add expense -->
  <div class="panel mb-4">

    <h2 class="panel-title">Add expense</h2>

    <form id="addForm" novalidate>

      <div class="add-form-row">
        <div class="field">
          <label class="form-label" for="addTitle">Title</label>
          <input type="text" class="form-control" id="addTitle" placeholder="Lunch" required>
        </div>

        <div class="field">
          <label class="form-label" for="addAmount">Amount</label>
          <input type="number" step="0.01" min="0.01" class="form-control" id="addAmount" placeholder="4.50" required>
        </div>

        <div class="field">
          <label class="form-label" for="addCategory">Category</label>
          <select class="form-select" id="addCategory" required>
            <option value="">Choose...</option>
            <option>Food</option>
            <option>Transport</option>
            <option>Bills</option>
            <option>Entertainment</option>
            <option>Other</option>
          </select>
        </div>

        <div class="field">
          <label class="form-label" for="addDate">Date</label>
          <input type="date" class="form-control" id="addDate" required>
        </div>
      </div>

      <button type="submit" class="btn btn-add mt-3">Add expense</button>
    </form>
  </div>

  <!-- Expenses table -->
  <div class="panel">
    <div class="panel-header">
      <h2 class="panel-title mb-0">Expenses</h2>

      <div class="d-flex align-items-center gap-2">
        <label class="mb-0 text-muted" for="filterCategory">Category</label>
        <select id="filterCategory" class="form-select w-auto">
          <option value="">All</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Bills</option>
          <option>Entertainment</option>
          <option>Other</option>
        </select>
      </div>
    </div>

    <div id="spinner" class="text-center my-4 d-none">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table expenses-table align-middle mb-0">
        <thead>
          <tr>
            <th>Title</th>
            <th class="text-end">Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="expensesTableBody"></tbody>
      </table>
    </div>
    <p id="emptyState" class="text-muted text-center d-none py-3 mb-0">No expenses yet.</p>
  </div>

  <!-- Bonus: chart by category -->
  <div class="panel mt-4">
    <h2 class="panel-title">Expenses by category</h2>
    <canvas id="categoryChart" height="110"></canvas>
  </div>
</div>

<!-- Edit modal -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="editForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Edit Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editId">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" id="editTitle" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Amount</label>
            <input type="number" step="0.01" min="0.01" class="form-control" id="editAmount" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" id="editCategory" required>
              <option>Food</option>
              <option>Transport</option>
              <option>Bills</option>
              <option>Entertainment</option>
              <option>Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" id="editDate" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-add">Save changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
