<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 0 - Task 1: fetch + Bootstrap Cards</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <h1 class="mb-4">Task 1: Users from a public API</h1>

  <div id="spinner" class="text-center my-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

  <div id="cardsContainer" class="row g-3"></div>
</div>

<script>
// change this to a wrong URL on purpose to test the error/alert path
const API_URL = "https://jsonplaceholder.typicode.com/users";

async function loadUsers() {
  const spinner = document.getElementById("spinner");
  const alertBox = document.getElementById("alertBox");
  const container = document.getElementById("cardsContainer");

  spinner.classList.remove("d-none");
  alertBox.classList.add("d-none");
  container.innerHTML = "";

  try {
    const response = await fetch(API_URL);          // 1st await: wait for the HTTP response
    if (!response.ok) {
      throw new Error(`Request failed with status ${response.status}`);
    }
    const users = await response.json();             // 2nd await: wait for the body to be parsed as JSON

    users.forEach(user => {
      const col = document.createElement("div");
      col.className = "col-sm-6 col-lg-4";
      col.innerHTML = `
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">${user.name}</h5>
            <h6 class="card-subtitle mb-2 text-muted">${user.company.name}</h6>
            <p class="card-text mb-1"><strong>Email:</strong> ${user.email}</p>
            <p class="card-text"><strong>City:</strong> ${user.address.city}</p>
          </div>
        </div>`;
      container.appendChild(col);
    });
  } catch (err) {
    alertBox.textContent = "Could not load users: " + err.message;
    alertBox.classList.remove("d-none");
  } finally {
    spinner.classList.add("d-none");
  }
}

loadUsers();
</script>
</body>
</html>
